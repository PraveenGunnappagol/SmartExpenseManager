<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - Smart Expense Manager</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/forms.css"
    >
</head>

<body>

    <div id="toast" class="toast"></div>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">
                <div class="auth-logo">₹</div>

                <h1>Smart Expense Manager</h1>

                <p>
                    Create your account to get started
                </p>
            </div>

            <form id="signup-form">

                <div class="form-group">
                    <label for="signup-username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="signup-username"
                        name="username"
                        placeholder="Choose a username"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signup-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signup-email"
                        name="email"
                        placeholder="Enter your email"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signup-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signup-password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signup-confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="signup-confirm-password"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="primary-btn auth-btn"
                >
                    Create Account
                </button>

            </form>

            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>
            </div>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/signup.js"></script>

</body>

</html>
