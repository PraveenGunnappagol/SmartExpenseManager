<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Smart Expense Manager</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/forms.css"
    >
</head>

<body>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">
                <div class="auth-logo">₹</div>

                <h1>Smart Expense Manager</h1>

                <p>
                    Sign in to manage your finances
                </p>
            </div>

            <form id="login-form">

                <div class="form-group">
                    <label for="login-username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="login-username"
                        name="username"
                        placeholder="Enter your username"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="primary-btn auth-btn"
                >
                    Login
                </button>

            </form>

            <div class="auth-footer">
                <p>
                    Don't have an account?
                    <a href="signup.html">
                        Create one
                    </a>
                </p>
            </div>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
